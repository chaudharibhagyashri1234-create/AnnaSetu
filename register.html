<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - AnnaSetu</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            🍲 AnnaSetu
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="index.html#how-it-works">
                    How It Works
                </a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="register.html">Register</a>
            </li>

        </ul>

    </nav>


    <!-- Registration Section -->

    <section class="login-section">

        <div class="login-box">

            <h1>Create Account 📝</h1>

            <p>Join AnnaSetu and help reduce food waste</p>


            <form id="registerForm">


                <!-- Full Name -->

                <label for="name">
                    Full Name / Organization Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- Email -->

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Phone -->

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    required
                >


                <!-- User Type -->

                <label for="userType">
                    Register As
                </label>

                <select id="userType" required>

                    <option value="">
                        Select User Type
                    </option>

                    <option value="donor">
                        Food Donor
                    </option>

                    <option value="ngo">
                        NGO / Receiver
                    </option>

                </select>


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >


                <!-- Confirm Password -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >


                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn"
                >
                    Create Account
                </button>


            </form>


            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login Here
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 AnnaSetu | SDG 2 - Zero Hunger
        </p>

    </footer>


    <script src="js/register.js"></script>

</body>

</html>
